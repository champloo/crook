# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
# Update with `devenv-update-cooldown` (nix-dotfiles), never a plain `devenv update`: inputs are only
# locked to revisions at least 7 days old (nix-dotfiles docs/flake-update-cooldown.md, "devenv projects").
inputs:
  llm-agents:
    url: github:numtide/llm-agents.nix
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
